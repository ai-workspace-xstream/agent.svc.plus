---
- name: Restart xconnect-edge-agent
  ansible.builtin.systemd:
    name: "{{ xconnect_edge_agent_service_name }}"
    state: restarted
    daemon_reload: true

- name: Reload xconnect-edge-agent
  ansible.builtin.systemd:
    name: "{{ xconnect_edge_agent_service_name }}"
    state: reloaded

- name: Restart xray-exporter
  ansible.builtin.systemd:
    name: "{{ xray_exporter_service_name }}"
    state: restarted
    daemon_reload: true
